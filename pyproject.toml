[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-lean"
version = "0.1.0"
description = "Get 5x more from your Claude Code token budget — audit, trim, and switch context profiles per project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "vipin", email = "contact@buffercode.in" },
]
keywords = ["claude-code", "tokens", "context", "optimization", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
accurate = [
    "tiktoken>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
claude-lean = "claude_lean.cli:main"

[project.urls]
Homepage = "https://github.com/vipin/claude-lean"
Repository = "https://github.com/vipin/claude-lean"
Documentation = "https://github.com/vipin/claude-lean#readme"
Issues = "https://github.com/vipin/claude-lean/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]
